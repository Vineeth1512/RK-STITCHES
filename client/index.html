    <title>RK STITCHES | Premium Tailoring & Custom Stitching Studio</title>

    <!-- Theme Initialization Script -->
    <script>
      (function() {
        try {
          const storedTheme = localStorage.getItem('rk_theme');
          const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (storedTheme === 'dark' || (!storedTheme && systemPrefersDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-stone-50 text-stone-900 dark:bg-stone-950 dark:text-stone-100 font-sans antialiased transition-colors duration-200">

  </body>
